{{- if include "hodor.installsHodor" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hodor.serviceAccountName" . }}
  labels:
    {{- include "hodor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Hodor never talks to the Kubernetes interface, so its pods carry no token for it.
automountServiceAccountToken: false
{{- end }}

{{- end }}
