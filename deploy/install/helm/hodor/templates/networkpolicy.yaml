{{- if .Values.networkPolicy.enabled }}
# Applies to every pod of the release: servers, workers, the migration job and hodor-ext-authz. Only the
# servers have the port `http`, and only hodor-ext-authz the port `grpc`, so nothing can connect to a worker
# or to the job. The operations port is not opened to
# other pods: the kubelet, which runs the health checks from the node, is not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hodor.fullname" . }}
  labels:
    {{- include "hodor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hodor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.extAuthz.enabled }}
    # Only hodor-ext-authz has the port `grpc`, which the proxies of the protected applications call.
    - ports:
        - port: grpc
          protocol: TCP
      {{- with .Values.extAuthz.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # The name service of the cluster.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.extAuthz.enabled }}
    # hodor-ext-authz asks the servers.
    - ports:
        - port: http
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "hodor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
    {{- end }}
  {{- end }}
{{- end }}
