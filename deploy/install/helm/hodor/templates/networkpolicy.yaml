{{- if and .Values.networkPolicy.enabled (include "hodor.installsHodor" .) }}
{{- $linkerd := eq (include "hodor.meshProvider" .) "linkerd" }}
{{- /* Who may reach the servers: networkPolicy.ingressFrom, and when it names anyone, the release's own
       hodor-ext-authz and hodor-cert-manager-issuer, which ask the servers. Empty: anyone in the cluster. */}}
{{- $serverPeers := list }}
{{- with .Values.networkPolicy.ingressFrom }}
{{- $serverPeers = . }}
{{- range $component, $installed := dict "ext-authz" $.Values.extAuthz.enabled "cert-manager-issuer" $.Values.certManagerIssuer.enabled }}
{{- if $installed }}
{{- $selector := merge (dict "app.kubernetes.io/component" $component) (include "hodor.selectorLabels" $ | fromYaml) }}
{{- $serverPeers = append $serverPeers (dict "podSelector" (dict "matchLabels" $selector)) }}
{{- end }}
{{- end }}
{{- end }}
# Applies to every pod of the release: servers, workers, the migration job, hodor-ext-authz and
# hodor-cert-manager-issuer. Only the servers have the port `http`, and only hodor-ext-authz the port `grpc`,
# so nothing can connect to a worker, to the job or to the issuer. The operations port is not opened to
# other pods: the kubelet, which runs the health checks from the node, is not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hodor.fullname" . }}
  labels:
    {{- include "hodor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hodor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $serverPeers }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.extAuthz.enabled }}
    # Only hodor-ext-authz has the port `grpc`, which the proxies of the protected applications call.
    - ports:
        - port: grpc
          protocol: TCP
      {{- with .Values.extAuthz.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # The name service of the cluster.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
    {{- with include "hodor.meshControlPlane" . }}
    # The mesh's control plane, where the proxy gets its configuration and its certificate.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if or .Values.extAuthz.enabled .Values.certManagerIssuer.enabled }}
    # hodor-ext-authz and hodor-cert-manager-issuer ask the servers. The Kubernetes interface the issuer
    # watches is listed in `to`.
    - ports:
        - port: http
          protocol: TCP
        {{- if $linkerd }}
        # Where Linkerd's proxy beside a server receives the connection.
        - port: 4143
          protocol: TCP
        {{- end }}
      to:
        - podSelector:
            matchLabels:
              {{- include "hodor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
    {{- end }}
  {{- end }}
{{- if $linkerd }}
---
# Every connection between two of Linkerd's proxies arrives on port 4143, whatever port it is for. On the
# servers' pods, it is opened to the servers' callers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hodor.fullname" . }}-server-mesh
  labels:
    {{- include "hodor.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "hodor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4143
          protocol: TCP
      {{- with $serverPeers }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.extAuthz.enabled }}
---
# On hodor-ext-authz's pods, port 4143 is opened to the proxies of the protected applications only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hodor.fullname" . }}-ext-authz-mesh
  labels:
    {{- include "hodor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ext-authz
spec:
  podSelector:
    matchLabels:
      {{- include "hodor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ext-authz
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4143
          protocol: TCP
      {{- with .Values.extAuthz.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
