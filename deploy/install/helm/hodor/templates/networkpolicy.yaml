{{- if and .Values.networkPolicy.enabled (include "hodor.installsHodor" .) }}
# Applies to every pod of the release: servers, workers, the migration job, hodor-ext-authz and
# hodor-cert-manager-issuer. Only the servers have the port `http`, and only hodor-ext-authz the port `grpc`,
# so nothing can connect to a worker, to the job or to the issuer. The operations port is not opened to
# other pods: the kubelet, which runs the health checks from the node, is not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hodor.fullname" . }}
  labels:
    {{- include "hodor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hodor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
        {{- if eq (include "hodor.meshProvider" .) "linkerd" }}
        # Where Linkerd's proxy receives every connection from another of its proxies.
        - port: 4143
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.extAuthz.enabled }}
    # Only hodor-ext-authz has the port `grpc`, which the proxies of the protected applications call.
    - ports:
        - port: grpc
          protocol: TCP
      {{- with .Values.extAuthz.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # The name service of the cluster.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
    {{- with include "hodor.meshControlPlane" . }}
    # The mesh's control plane, where the proxy gets its configuration and its certificate.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if or .Values.extAuthz.enabled .Values.certManagerIssuer.enabled }}
    # hodor-ext-authz and hodor-cert-manager-issuer ask the servers. The Kubernetes interface the issuer
    # watches is listed in `to`.
    - ports:
        - port: http
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "hodor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
    {{- end }}
  {{- end }}
{{- end }}
