# The settings of a Hodor installation on Kubernetes. How to use them, step by step:
# docs/operations/install-on-kubernetes.md.
#
# Two values have no default and must be given: publicUrl and secret.name.
# No password or key is ever written here: they are read from the Secret that secret.name names.

image:
  # Where the Hodor image is. Each release from 0.3.0 publishes its image here; an earlier version, or a
  # build of your own, is pushed to a registry of yours, such as registry.example.com/hodor.
  repository: ghcr.io/ortisun/hodor
  # The version to run. Empty: the version this chart was made for (appVersion in Chart.yaml).
  tag: ""
  pullPolicy: IfNotPresent
  # Names of Secrets that hold the credentials of a private registry.
  pullSecrets: []

# The address people use to reach Hodor: https, the name, no path. Required.
# Cookies and the links in messages rely on it.
publicUrl: ""

# The Secret that holds everything secret. It is made before the chart is installed, by you or by whatever
# manages secrets in the cluster, in the namespace of the release. Required.
secret:
  name: ""
  # The key of each value inside the Secret.
  keys:
    # Connection address of the role that owns the schema. Read by the migration job and nothing else.
    ownerDatabaseUrl: owner-database-url
    # Connection address of the server's role, a member of hodor_app.
    serverDatabaseUrl: server-database-url
    # Connection addresses of the worker's two roles, members of hodor_app and of hodor_platform.
    workerDatabaseUrl: worker-database-url
    workerPlatformDatabaseUrl: worker-platform-database-url
    # The keys that keep the secrets of identity providers and the signing keys encrypted, as identifier:key.
    # Read by the servers and the workers.
    secretKeys: secret-keys
    # Address of the mail server, such as smtps://user:password@mail.example.com:465. Read when mail.enabled.
    smtpUrl: smtp-url
    # The role identifier and secret identifier of Hodor's AppRole in OpenBao. Read when keyProvider.openbao
    # signs in with an AppRole.
    openbaoRoleId: openbao-role-id
    openbaoSecretId: openbao-secret-id

# Where the tenants' signing keys are made and used. How to prepare OpenBao, step by step:
# docs/operations/keys-in-openbao.md.
keyProvider:
  # local: inside the servers and workers, wrapped under secret-keys. openbao: in OpenBao's Transit secrets
  # engine, which signs and never lets a key out. Only new keys follow this value; each key keeps signing where
  # it was made. The keys of secrets at rest are local either way.
  signingKeys: local
  openbao:
    # true: the servers and workers reach OpenBao, and sign with the keys made there. Required for
    # signingKeys: openbao, and kept true afterwards for as long as a key made there may sign.
    enabled: false
    # Its address: https, the name and the port, no path, such as https://openbao.openbao.svc:8200. Required
    # when enabled. Reached directly, never through a proxy; with networkPolicy.egress, list it in `to`.
    address: ""
    # Where Transit is mounted for Hodor. The policy in deploy/openbao/hodor-policy.hcl names this mount.
    transitMount: hodor-transit
    # How Hodor signs in: kubernetes, with a token of the release's service account made for OpenBao alone, or
    # approle, with the identifiers in the Secret (secret.keys.openbaoRoleId and openbaoSecretId).
    authMethod: kubernetes
    # Where that method is mounted in OpenBao. Empty: kubernetes or approle.
    authMount: ""
    # The role of OpenBao's Kubernetes method that gives Hodor its policy.
    kubernetesRole: hodor
    # The audience of the service account token Hodor presents; the role must name it.
    tokenAudience: openbao
    # The ConfigMap, in the namespace of the release, holding the certificate of the authority that issued
    # OpenBao's certificate, and its key in the ConfigMap. Empty: the authorities the image trusts. When set,
    # only this authority is trusted for OpenBao.
    certificateAuthority:
      configMap: ""
      key: ca.crt
    # Milliseconds one request to OpenBao may take, 1 to 60000. A signature waits for it.
    timeoutMs: 5000

# The messages Hodor sends: address verification and password recovery.
mail:
  # false: no message is delivered, and they wait in the database.
  enabled: false
  # The address messages come from, such as "Hodor <no-reply@example.com>". Required when enabled.
  from: ""

# The LDAP directories identity providers may name, each as host:port. Empty: none can be used.
directoryHosts: []

# The address ranges of the ingress controller, and of any load balancer in front of it, whose forwarded
# header is believed. Empty: the client address is the connection's, so everyone behind the Ingress shares
# one limit on sign-in attempts. Name the range the ingress controller's pods get their addresses from, and
# turn on networkPolicy so that nothing else in that range can connect.
trustedProxies: []
# The header they write: x-forwarded-for or forwarded; or none, when they are named only for the caller's
# identity below.
forwardedHeader: x-forwarded-for
# The header the proxy in front of Hodor writes the caller's identity into, for workloads of a service mesh:
# client-cert, x-forwarded-client-cert or l5d-client-id. Read only from trustedProxies. Empty: none is read.
clientIdentityHeader: ""

# The authorities Hodor's outbound requests trust, in place of the public ones the image holds: a ConfigMap
# of yours, made before the chart is installed, whose key holds certificates in PEM. For an identity
# provider or a trust domain's bundle endpoint served under an authority of your own. The file replaces the
# image's authorities, so it holds the public ones too when Hodor also calls public addresses.
# Empty: the image's authorities.
outboundAuthorities:
  configMap: ""
  key: authorities.pem

log:
  # json or pretty.
  format: json
  # What is logged, such as info or info,hodor_adapters_postgres=debug.
  filter: info

# Where metrics and traces are sent, over OTLP/HTTP, as full addresses. Empty: none are sent.
telemetry:
  metricsEndpoint: ""
  tracesEndpoint: ""

server:
  # How many servers run when autoscaling is off. Three, spread across zones, keep a majority through the
  # loss of a zone.
  replicas: 3
  # Size of the database connection pool of each server.
  databaseMaxConnections: 10
  # Password hashes one server computes at the same time. Each uses about 19 MiB of memory, so this value
  # times 19 MiB must fit under the memory limit below with room for the rest.
  passwordHashConcurrency: 4
  # Seconds a server keeps serving after it is told to stop, while it reports itself not ready, so that
  # requests stop being sent to it.
  shutdownDrainSeconds: 5
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    # Average processor use, as a percentage of the request, above which servers are added.
    targetProcessorUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    # Servers that may be taken down at once by a planned disruption, such as draining a node.
    maxUnavailable: 1
  # More environment variables for the server, as Kubernetes writes them: a list of name and value.
  extraEnvironment: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  # How many workers run. They share the work without a leader; two keep it going while one restarts.
  replicas: 2
  # Size of each of the worker's two database connection pools.
  databaseMaxConnections: 5
  # The limit leaves room for one run of opa, which the worker asks to stay under 256 MiB, on top of the
  # worker itself (Decision 0026). The limit is what bounds a run's memory.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  extraEnvironment: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Before every install and upgrade, a job applies the migrations as the owner of the schema and creates
# the system tenant if it is missing. The servers and workers start after it succeeds.
migration:
  enabled: true
  # Seconds the job may take before the install or upgrade is given up.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

# The Service in front of the servers. Only the public port is in it; the operations port, which answers
# health checks without authentication, is reached by the kubelet alone.
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# The way in from outside the cluster. The host is taken from publicUrl.
ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    # true: the Ingress serves HTTPS for the host with the certificate in secretName.
    enabled: true
    # The Secret that holds the certificate. Empty: "<release>-tls", for a certificate manager to fill.
    secretName: ""

networkPolicy:
  enabled: false
  # Who may reach the servers' public port, as Kubernetes writes network policy peers. Empty: anyone in
  # the cluster. For an ingress controller in the namespace ingress-nginx:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  egress:
    # true: Hodor's pods may reach the cluster's name service and what `to` lists, and nothing else.
    enabled: false
    # Where Hodor's pods may connect, as Kubernetes writes egress rules: the database, the mail server,
    # the collector of metrics and traces, the identity providers and directories.
    to: []

# hodor-ext-authz: Envoy's external authorization for the proxies of a service mesh, each check answered by
# Hodor's Authorization API. Off by default. docs/operations/hodor-ext-authz.md says what it does and how to
# set its tenant up; docs/operations/install-on-kubernetes.md lists these values.
extAuthz:
  enabled: false
  image:
    # Its own image. Empty tag: the version this chart was made for.
    repository: ghcr.io/ortisun/hodor-ext-authz
    tag: ""
  replicas: 2
  # The tenant's slug. Required when enabled.
  tenant: ""
  # Where it reaches Hodor. Empty: this release's Service, http://<release>.<namespace>.svc.cluster.local:<port>.
  hodorUrl: ""
  # The tenant's issuer, which the checked token's iss must be. Empty: publicUrl followed by /t/<tenant>.
  issuer: ""
  # How long one call to Hodor may take before the request is denied, from 1 to 60000.
  timeoutMilliseconds: 1000
  # Where the claims of the token the proxy checked are. Empty: none is read, and the subject is always the
  # caller's identity. Either
  #   metadata:
  #     namespace: envoy.filters.http.jwt_authn
  #     key: hodor
  # or
  #   header: x-hodor-token-claims
  token: {}
  # One entry per protected application:
  #   - destination: spiffe://cluster.local/ns/shop/sa/orders
  #     clientId: <the application's client, bound to the identity of this service account>
  #     routes:
  #       - methods: [GET]
  #         path: /orders/{id}
  #         resourceType: order
  #         action: read
  applications: []
  # Its own Kubernetes service account, which gives it its mesh identity.
  serviceAccount:
    # false: the pods use the service account named below, which must exist.
    create: true
    # Empty: "<release>-ext-authz".
    name: ""
    annotations: {}
  service:
    # The gRPC port the mesh's provider names.
    port: 9191
  resources:
    requests:
      cpu: 100m
      memory: 32Mi
    limits:
      memory: 128Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  networkPolicy:
    # With networkPolicy.enabled, who may reach its gRPC port, as Kubernetes writes network policy peers.
    # Empty: anyone in the cluster. Name the namespaces of the protected applications, whose proxies call it.
    ingressFrom: []
  extraEnvironment: []
  # Where a mesh's sidecar is asked for, when the namespace does not ask for it already.
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# hodor-cert-manager-issuer: cert-manager's outside issuer, which signs the approved requests for an authority of
# its HodorIssuer and HodorClusterIssuer through the tenant's certificate authority. Off by default.
# docs/operations/hodor-cert-manager-issuer.md says what it does and how to set its tenant up;
# docs/operations/install-on-kubernetes.md lists these values. cert-manager must be installed first.
certManagerIssuer:
  enabled: false
  # true: the release holds the issuer alone, for a cluster of meshes where Hodor does not run. None of Hodor's
  # own values is then needed, and hodorUrl is required.
  only: false
  image:
    # Its own image. Empty tag: the version this chart was made for.
    repository: ghcr.io/ortisun/hodor-cert-manager-issuer
    tag: ""
  # The tenant's slug. Required when enabled.
  tenant: ""
  # Where it reaches Hodor. Empty: this release's Service, http://<release>.<namespace>.svc.cluster.local:<port>.
  # Required with only.
  hodorUrl: ""
  # The tenant's issuer, which its assertions name as their audience. Empty: publicUrl followed by /t/<tenant>,
  # or with only, hodorUrl followed by /t/<tenant>.
  issuer: ""
  # How long one call to Hodor may take, from 1 to 60000.
  timeoutMilliseconds: 10000
  # The client of the issuer's service account in Hodor, holding the scope certificate-authority:sign. Required
  # when enabled.
  clientId: ""
  authentication:
    # forwarded: the client proves who it is with the identity of the issuer's pod in its mesh, which its sidecar
    # presents; nothing secret is held. private_key_jwt: with the key in the Secret below.
    method: forwarded
    privateKeyJwt:
      # The Secret, in the release's namespace, that holds the key in PEM. Required with private_key_jwt.
      secretName: ""
      # The key of the Secret that holds it.
      key: key.pem
      # The kid of the key among the client's keys, if it has more than one.
      keyId: ""
  # true: the chart defines the kinds HodorIssuer and HodorClusterIssuer. false: they are defined already, by
  # another release in the same cluster.
  customResourceDefinitions: true
  # cert-manager's own approver approves every request of the issuers it may approve for. true: it may approve
  # for HodorIssuer and HodorClusterIssuer, so that whoever can create a CertificateRequest naming one has it
  # approved. false: approve otherwise, with approver-policy for example.
  approveWithCertManager:
    enabled: false
    # cert-manager's own service account.
    serviceAccount: cert-manager
    namespace: cert-manager
  # Its own Kubernetes service account, which its ClusterRole is bound to and which gives it its mesh identity.
  serviceAccount:
    # false: the pod uses the service account named below, which must exist.
    create: true
    # Empty: "<release>-cert-manager-issuer".
    name: ""
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
  extraEnvironment: []
  # Where a mesh's sidecar is asked for, when the namespace does not ask for it already.
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  # false: the pods use the service account named below, which must exist.
  create: true
  # Empty: the name of the release.
  name: ""
  annotations: {}

# Replaces the name the resources are given, which is otherwise the name of the release.
fullnameOverride: ""
