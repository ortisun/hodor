# SPIRE for the demonstration of Milestone 10: a server of the trust domain workloads.example.org,
# which serves its bundle at a SPIFFE bundle endpoint, and an agent on every node, which gives the
# workloads of the cluster their JWT-SVIDs. Based on the Kubernetes quickstart of the SPIRE tutorials.
#
# NOT FOR ANYTHING REAL. The server keeps its keys on a small volume, the agent trusts the kubelet
# without checking it, and the bundle endpoint's certificate is made by the demonstration script under
# an authority of its own, in the Secret spire-bundle-endpoint, which the script creates before this.
#
#   python3 deploy/demo/workload_identity.py applies it; see docs/operations/quick-start.md.

apiVersion: v1
kind: Namespace
metadata:
  name: spire
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: spire
---
# Filled by the server's k8sbundle notifier: the bundle the agents start from.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle
  namespace: spire
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle
  namespace: spire
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-server-bundle
---
# The server attests agents by their projected service account tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-attestation
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-attestation
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-attestation
---
# The agent attests workloads by asking the kubelet about their pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-agent-attestation
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-agent-attestation
subjects:
  - kind: ServiceAccount
    name: spire-agent
    namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-agent-attestation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "workloads.example.org"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      default_jwt_svid_ttl = "5m"

      # The SPIFFE bundle endpoint Hodor fetches the trust domain's bundle from, with the https_web
      # profile: a certificate any client can check, here under the demonstration's own authority.
      federation {
        bundle_endpoint {
          address = "0.0.0.0"
          port = 8443
          refresh_hint = "1m"
          profile "https_web" {
            serving_cert_file {
              cert_file_path = "/run/spire/bundle-endpoint/tls.crt"
              key_file_path = "/run/spire/bundle-endpoint/tls.key"
              file_sync_interval = "1m"
            }
          }
        }
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "hodor-milestone-10" = {
              service_account_allow_list = ["spire:spire-agent"]
            }
          }
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }

      Notifier "k8sbundle" {
        plugin_data {
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
  labels:
    app: spire-server
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      securityContext:
        fsGroup: 1000
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.5
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - name: grpc
              containerPort: 8081
            - name: bundle
              containerPort: 8443
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bundle-endpoint
              mountPath: /run/spire/bundle-endpoint
              readOnly: true
            - name: data
              mountPath: /run/spire/data
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            failureThreshold: 2
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: spire-server
        - name: bundle-endpoint
          secret:
            secretName: spire-bundle-endpoint
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
    # The bundle endpoint, at https://spire-server.spire.svc:8443.
    - name: https-bundle
      port: 8443
      targetPort: bundle
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire"
      log_level = "INFO"
      server_address = "spire-server"
      server_port = "8081"
      socket_path = "/run/spire/sockets/agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "workloads.example.org"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "hodor-milestone-10"
        }
      }

      KeyManager "memory" {
        plugin_data {
        }
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          # kind's kubelet serves a certificate the cluster's authority did not sign.
          skip_kubelet_verification = true
          node_name_env = "MY_NODE_NAME"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: spire-agent
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.5
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: sockets
              mountPath: /run/spire/sockets
            - name: token
              mountPath: /var/run/secrets/tokens
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            failureThreshold: 2
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: spire-agent
        - name: bundle
          configMap:
            name: spire-bundle
        - name: sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
---
# A second SPIRE server, of another trust domain, elsewhere.example.org, which the tenant does not trust:
# the demonstration mints a JWT-SVID with it and sees Hodor refuse it. It attests no agent.
apiVersion: v1
kind: Namespace
metadata:
  name: elsewhere
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: elsewhere
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "elsewhere.example.org"
      data_dir = "/run/spire/data"
      log_level = "INFO"
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      NodeAttestor "join_token" {
        plugin_data {
        }
      }

      KeyManager "memory" {
        plugin_data {
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-server
  namespace: elsewhere
  labels:
    app: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      automountServiceAccountToken: false
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.5
          args: ["-config", "/run/spire/config/server.conf"]
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: data
              mountPath: /run/spire/data
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: spire-server
        - name: data
          emptyDir: {}
