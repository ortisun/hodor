# The workload of the Linkerd cluster: ledger, in the mesh, whose identity is
# ledger.ledger.serviceaccount.identity.linkerd.west.acme.example. It answers with the headers of each request,
# among them l5d-client-id, the identity its proxy read from the caller's certificate. A port of the node
# reaches it from the Istio cluster; its proxy ends the caller's TLS when the caller names its identity.
#
#   python3 deploy/demo/certificate_authority.py applies it; see docs/operations/quick-start.md.

apiVersion: v1
kind: Namespace
metadata:
  name: ledger
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: ledger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: ledger
  labels:
    app: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      serviceAccountName: ledger
      containers:
        - name: app
          image: traefik/whoami:v1.11.0
          args: ["--port", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: ledger
spec:
  type: NodePort
  selector:
    app: ledger
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30443
