# Linkerd's identity issuer, kept by cert-manager in the Secret linkerd-identity-issuer and signed through Hodor
# by the tenant's certificate authority, as docs/operations/hodor-cert-manager-issuer.md writes it for the trust
# domain of the Linkerd cluster: 2 days. It is renewed 47 hours and 58 minutes before it expires, two minutes
# after it is signed, so that the demonstration sees cert-manager renew it with no one acting; the script then
# has it renewed 25 hours before it expires, as a real cluster would.
#
#   python3 deploy/demo/certificate_authority.py applies it; see docs/operations/quick-start.md.

apiVersion: hodor.ortisun.github.io/v1alpha1
kind: HodorIssuer
metadata:
  name: hodor
  namespace: linkerd
spec: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-identity-issuer
  namespace: linkerd
spec:
  secretName: linkerd-identity-issuer
  duration: 48h
  renewBefore: 47h58m
  issuerRef:
    group: hodor.ortisun.github.io
    kind: HodorIssuer
    name: hodor
  commonName: identity.linkerd.west.acme.example
  dnsNames:
    - identity.linkerd.west.acme.example
  isCA: true
  privateKey:
    algorithm: ECDSA
  usages:
    - cert sign
    - crl sign
