# Orders protected by Istio, as the service mesh guide writes it: its sidecar asks hodor-ext-authz about
# every request and checks the tenant's tokens. A sidecar asks before it checks, and hodor-ext-authz checks the
# token's signature itself; the ingress gateway checks the token first as well, and forwards it. The
# demonstration fills in the tenant's issuer, which changes with each run; istiod reads its key set from Hodor.
#
#   python3 deploy/demo/service_mesh.py applies it; see docs/operations/quick-start.md.

apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: edge
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: ${issuer}
      jwksUri: ${issuer}/oauth2/jwks
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: orders
  namespace: shop
spec:
  selector:
    matchLabels:
      app: orders
  jwtRules:
    - issuer: ${issuer}
      jwksUri: ${issuer}/oauth2/jwks
      audiences:
        - https://orders.example.com
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: orders-through-hodor
  namespace: shop
spec:
  selector:
    matchLabels:
      app: orders
  action: CUSTOM
  provider:
    name: hodor
  rules:
    - {}
