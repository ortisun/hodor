# The certification deployment: the installation with Docker, with the web
# server's settings of the OpenID Foundation's profiles and a mail server
# that delivers nothing. docs/operations/certification-deployment.md is the
# runbook.
#
# NOTHING REAL GOES HERE: the logs of the hosted suite, published with the
# certification, hold the credentials of what runs here.
#
# An override of deploy/install/docker/compose.yaml, read after it, with the
# settings of `.env` beside this file:
#
#   docker compose --env-file deploy/certification/.env \
#     -f deploy/install/docker/compose.yaml -f deploy/certification/compose.yaml \
#     up --detach --wait
#
# Compose reads every path of both files from the folder of the first:
# `../../certification/` below is this folder.

# Not `hodor-install`: an installation on the same host keeps its own
# containers and volumes.
name: hodor-certification

services:
  # The profile `https`, reading Caddyfile in place of the command line of the
  # installation: an RSA certificate, TLS 1.2 and 1.3, and the cipher suites
  # FAPI asks for.
  https:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      HODOR_PUBLIC_URL: ${HODOR_PUBLIC_URL:?Set HODOR_PUBLIC_URL in deploy/certification/.env}
    volumes:
      - ../../certification/Caddyfile:/etc/caddy/Caddyfile:ro

  # Catches every message Hodor sends and delivers none: the person's
  # password is set through the link of a recovery message, which the
  # certification script reads from here. Its interface is on this host alone.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${CERTIFICATION_MAIL_PORT:-8025}:8025"
    restart: unless-stopped

  worker:
    environment:
      HODOR_SMTP_URL: smtp://mail:1025
      HODOR_MAIL_FROM: Hodor certification <no-reply@example.com>
