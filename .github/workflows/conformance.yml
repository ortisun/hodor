# The plans of the OpenID conformance suite against Hodor, as Decision 0051
# says: each plan in a job of its own, against one image built once; the
# core set on every pull request into develop and every push, every plan on
# a pull request labelled `conformance: full`, on every pull request into
# main and every night on develop; an issue when the night's run fails.
# docs/operations/conformance.md, "When each plan runs", is the
# human-maintained page; deploy/conformance/plans.json lists the plans, and
# deploy/conformance/runs.mjs chooses among them.
name: OpenID conformance

on:
  pull_request:
    branches: [develop, main]
    # `labeled`, so that adding `conformance: full` runs every plan at once.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop, main]
  # GitHub starts it from the default branch, main; the jobs check out develop.
  schedule:
    - cron: "17 3 * * *"

# A new push, or the label `conformance: full`, replaces the run in progress
# of the same pull request or branch. Any other label, and the label on a
# pull request into main that already runs every plan, run nothing: they get
# a group of their own, so that they stop nothing.
concurrency:
  group: >-
    conformance-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}${{
    github.event.action == 'labeled'
    && (github.event.label.name != 'conformance: full' || github.base_ref == 'main')
    && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The set of plans the event calls for, and the commit every other job
  # checks out: develop's latest for the night, the event's otherwise.
  select:
    name: Choose the plans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      set: ${{ steps.choose.outputs.set }}
      plans: ${{ steps.choose.outputs.plans }}
      sha: ${{ steps.choose.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Test the choice of plans
        run: node --test deploy/conformance/test/runs.test.mjs
      - name: Choose the plans
        id: choose
        run: |
          node deploy/conformance/runs.mjs choose >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Built once for every job of the run, and passed to them as an artifact.
  image:
    name: Image for the conformance plans
    needs: select
    if: needs.select.outputs.set != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - name: Build the image
        run: docker build --file deploy/docker/Dockerfile --tag hodor:conformance .
      - name: Save the image
        run: docker save --output "$RUNNER_TEMP/hodor-conformance.tar" hodor:conformance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hodor-conformance-image
          path: ${{ runner.temp }}/hodor-conformance.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # One plan, by its short name in plans.json, against its own stack. The
  # stack starts first, so that the suite starts while the browser installs.
  plan:
    name: OpenID conformance (${{ matrix.plan }})
    needs: [select, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJSON(needs.select.outputs.plans) }}
    defaults:
      run:
        working-directory: deploy/conformance
    env:
      HODOR_IMAGE: hodor:conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hodor-conformance-image
          path: ${{ runner.temp }}/image
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image/hodor-conformance.tar"
      - name: Start Hodor and the suite
        run: docker compose -f compose.yaml up --wait
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/conformance/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run the plan
        run: node run.mjs
        env:
          CONFORMANCE_PLANS: ${{ matrix.plan }}
          CONFORMANCE_REPORT: conformance-results.json
      - name: Show what Hodor logged
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail 300 hodor worker suite-relay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-results-${{ matrix.plan }}
          path: deploy/conformance/conformance-results.json
          retention-days: 14
          overwrite: true

  # Issue-142: the certification script against Hodor from the same image,
  # started without the suite, from making what every ready plan of the
  # hosted suite needs to checking that nothing it made works once retired.
  # docs/operations/certification-deployment.md, "How it is tested".
  certification:
    name: Certification deployment against Hodor
    needs: [select, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HODOR_IMAGE: hodor:conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hodor-conformance-image
          path: ${{ runner.temp }}/image
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image/hodor-conformance.tar"
      - name: Start Hodor without the suite
        working-directory: deploy/conformance
        run: docker compose -f compose.yaml up --wait https worker mail
      - name: Make and retire the certification deployment
        working-directory: deploy/certification
        run: |
          node certification.mjs make > "$RUNNER_TEMP/certification.json"
          # The script given to node is JavaScript, in single quotes on purpose.
          # shellcheck disable=SC2016
          node -e '
            const printed = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const incomplete = printed.plans.filter((entry) =>
              !entry.configuration.server.discoveryUrl || !entry.configuration.client?.client_id);
            console.log(`${printed.plans.length} plan runs ready, ${printed.waiting.length} waiting`);
            if (printed.plans.length === 0 || incomplete.length > 0) process.exit(1);
          ' "$RUNNER_TEMP/certification.json"
          node certification.mjs retire
        env:
          HODOR_PUBLIC_URL: https://hodor.localhost:8453
          CERTIFICATION_MAIL_URL: http://127.0.0.1:28025
          CERTIFICATION_ACCEPT_ANY_CERTIFICATE: "1"
          CERTIFICATION_OUTPUT: ${{ runner.temp }}/certification
          CERTIFICATION_CLI: >-
            ["docker", "compose", "-f", "../conformance/compose.yaml", "run", "--rm", "--no-deps", "-T",
            "--entrypoint", "/usr/local/bin/hodor-cli",
            "-e", "HODOR_DATABASE_URL=postgres://hodor_server:dev-server@postgres:5432/hodor", "hodor"]
      - name: Show what Hodor logged
        if: failure()
        working-directory: deploy/conformance
        run: docker compose -f compose.yaml logs --no-color --tail 300 hodor worker

  # The night's failure, in an issue that names the plans and the tests; a
  # later failing night comments on it while it is open.
  nightly-issue:
    name: Report the nightly failure
    needs: [select, image, plan, certification]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # to open the issue of a failed night, or comment on it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.select.outputs.sha || 'develop' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Each plan's results in a folder of its own; none when no plan ran.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: conformance-results-*
          path: ${{ runner.temp }}/results
      - name: Open the issue, or comment on the one open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONFORMANCE_CHOSEN: ${{ needs.select.outputs.plans }}
          CONFORMANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node deploy/conformance/runs.mjs report "$RUNNER_TEMP/results" > "$RUNNER_TEMP/issue.md"
          title="The nightly conformance run failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
