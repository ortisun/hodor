name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  supply-chain:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  pages:
    name: Hosted pages and demonstration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/auth-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/auth-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The browser tests drive the pages as the image serves them, with
      # the whole development stack behind them.
      - name: Start the development stack
        working-directory: .
        run: docker compose -f deploy/docker/compose.yaml up --build --wait
      - name: Create a tenant that accepts registrations
        working-directory: .
        run: >
          docker compose -f deploy/docker/compose.yaml run --rm --no-deps
          --entrypoint /usr/local/bin/hodor-cli
          -e HODOR_DATABASE_URL=postgres://hodor_server:dev-server@postgres:5432/hodor
          server tenant create --slug acme --name "Acme" --open-registration
      - run: npx playwright install --with-deps chromium
      - run: npm run browser-tests
      # The demonstration of the milestone, as the quick-start tells an
      # operator to run it.
      - name: Run the demonstration
        working-directory: .
        run: python3 deploy/demo/demo.py
      - name: Show what the stack logged
        if: failure()
        working-directory: .
        run: docker compose -f deploy/docker/compose.yaml logs --no-color --tail 200 server worker system-tenant
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-tests-report
          path: frontend/auth-ui/playwright-report
          retention-days: 7
