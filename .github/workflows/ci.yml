name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  supply-chain:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete
      # What cargo deny does not cover: the actions of these workflows and
      # the licenses of the npm packages. docs/security/supply-chain.md.
      - run: python3 -I .github/scripts/supply_chain.py test
      - run: python3 -I .github/scripts/supply_chain.py actions .github/workflows
      - run: >
          python3 -I .github/scripts/supply_chain.py licenses
          frontend/auth-ui/package-lock.json
          frontend/admin-console/package-lock.json
          frontend/design-system/showcase/package-lock.json
          deploy/conformance/package-lock.json

  console:
    name: Admin console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/admin-console/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds against the compiled theme of the hosted pages.
      - run: npm run build

  showcase:
    name: Design system showcase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/design-system/showcase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/design-system/showcase/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      # Typechecks, then builds against the compiled theme of the hosted pages.
      - run: npm run build

  pages:
    name: Hosted pages and demonstration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/auth-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/auth-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run theme-check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The browser tests drive the pages as the image serves them, with
      # the whole development stack behind them.
      - name: Start the development stack
        working-directory: .
        run: docker compose -f deploy/docker/compose.yaml up --build --wait
      - name: Create a tenant that accepts registrations
        working-directory: .
        run: >
          docker compose -f deploy/docker/compose.yaml run --rm --no-deps
          --entrypoint /usr/local/bin/hodor-cli
          -e HODOR_DATABASE_URL=postgres://hodor_server:dev-server@postgres:5432/hodor
          server tenant create --slug acme --name "Acme" --open-registration
      - name: Add the development identity provider to the tenant
        working-directory: .
        run: >
          docker compose -f deploy/docker/compose.yaml run --rm --no-deps
          --entrypoint /usr/local/bin/hodor-cli
          -e HODOR_DATABASE_URL=postgres://hodor_server:dev-server@postgres:5432/hodor
          -e HODOR_PROVIDER_CLIENT_SECRET=development-client-secret
          server provider add --tenant acme --alias development
          --name "Development provider" --issuer http://provider:9400 --client-id hodor
      - name: Add the development directory to the tenant
        working-directory: .
        run: >
          docker compose -f deploy/docker/compose.yaml run --rm --no-deps
          --entrypoint /usr/local/bin/hodor-cli
          -e HODOR_DATABASE_URL=postgres://hodor_server:dev-server@postgres:5432/hodor
          -e HODOR_PROVIDER_CLIENT_SECRET=readonly-password
          server provider add --tenant acme --alias directory --kind ldap
          --name "Company directory" --issuer ldap://directory:389
          --client-id cn=readonly,dc=example,dc=org
          --base ou=people,dc=example,dc=org --filter "(uid={identifier})" --trust-email
      - name: Add the development SAML identity provider to the tenant
        working-directory: .
        run: >
          docker compose -f deploy/docker/compose.yaml run --rm --no-deps
          --entrypoint /usr/local/bin/hodor-cli
          -e HODOR_DATABASE_URL=postgres://hodor_server:dev-server@postgres:5432/hodor
          server provider add --tenant acme --alias corp --kind saml
          --name "Development SAML provider" --issuer urn:hodor:development-saml-provider
          --sign-on-address http://localhost:9500/sso
          --certificate "$(cat deploy/dev-saml-provider/certificate.pem)" --trust-email
      - run: npx playwright install --with-deps chromium
      - run: npm run browser-tests
      # The demonstration of the milestone, as the quick-start tells an
      # operator to run it.
      - name: Run the demonstration
        working-directory: .
        run: python3 deploy/demo/demo.py
      - name: Run the demonstration of Milestone 2
        working-directory: .
        run: python3 deploy/demo/external_identities.py
      - name: Run the demonstration of Milestone 3
        working-directory: .
        run: python3 deploy/demo/applications.py
      - name: Run the demonstration of Milestone 4
        working-directory: .
        run: python3 deploy/demo/strong_authentication.py
      - name: Run the demonstration of Milestone 5
        working-directory: .
        run: python3 deploy/demo/authorization.py
      - name: Run the demonstration of Milestone 7
        working-directory: .
        run: python3 deploy/demo/organizations.py
      - name: Run the demonstration of Milestone 8
        working-directory: .
        run: python3 deploy/demo/workloads.py
      - name: Run the demonstration of Milestone 9
        working-directory: .
        run: python3 deploy/demo/what_was_left_out.py
      # Last: its second worker removes the ended sessions and delivered
      # messages of every tenant of the stack.
      - name: Run the demonstration of Milestone 6
        working-directory: .
        run: python3 deploy/demo/operations.py
      # The tenants' signing keys in OpenBao: the server and the worker start
      # again making them there, and the demonstration of Milestone 3 signs
      # every token, rotates a key and checks every signature with keys only
      # OpenBao holds. Then the keys are looked for in OpenBao itself.
      - name: Run the demonstration of Milestone 3 with the signing keys in OpenBao
        working-directory: .
        env:
          HODOR_KEY_PROVIDER: openbao
        run: |
          docker compose -f deploy/docker/compose.yaml up --wait --no-build server worker
          python3 deploy/demo/applications.py
          docker compose -f deploy/docker/compose.yaml exec -T -e BAO_TOKEN=development-root-token openbao \
            bao list -address=http://127.0.0.1:8200 hodor-transit/keys | grep -q '^tenant-'
      - name: Show what the stack logged
        if: failure()
        working-directory: .
        run: docker compose -f deploy/docker/compose.yaml logs --no-color --tail 200 server worker system-tenant provider directory saml-provider edge webhook-receiver openbao openbao-setup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-tests-report
          path: frontend/auth-ui/playwright-report
          retention-days: 7

  # The demonstration of Milestone 10, as the quick-start tells an operator to
  # run it: a kind cluster with Istio and SPIRE, and Hodor installed in the
  # mesh with its chart, from the image built here. The script makes the
  # cluster; kind, kubectl and Helm are installed at the versions named.
  workload-identity:
    name: Workloads in a mesh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          install_only: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Build the image
        run: docker build --file deploy/docker/Dockerfile --tag hodor:milestone-10 .
      - name: Run the demonstration of Milestone 10
        run: python3 deploy/demo/workload_identity.py
      - name: Show what the cluster logged
        if: failure()
        run: |
          kind get kubeconfig --name hodor-milestone-10 > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl get pods --all-namespaces
          kubectl logs --namespace hodor deployment/hodor-server --all-containers --tail 200
          kubectl logs --namespace hodor deployment/hodor-worker --all-containers --tail 200
          kubectl logs --namespace spire statefulset/spire-server --tail 100
          kubectl logs --namespace spire daemonset/spire-agent --tail 100

  # The Basic OpenID Provider, Config OpenID Provider and Back-Channel OpenID
  # Provider plans of the OpenID conformance suite, against the image; the
  # back-channel logout plan is the acceptance of Issue-100. Then the Basic
  # and Back-Channel plans again with pairwise clients, the pairwise
  # configuration that is the acceptance of Issue-98.
  # docs/operations/conformance.md says what runs and which results are
  # expected.
  conformance:
    name: OpenID conformance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: deploy/conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/conformance/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build the image
        working-directory: .
        run: docker build --file deploy/docker/Dockerfile --tag hodor:conformance .
      - name: Start Hodor and the suite
        run: docker compose -f compose.yaml up --wait
        env:
          HODOR_IMAGE: hodor:conformance
      - name: Run the plans
        run: node run.mjs
        env:
          HODOR_IMAGE: hodor:conformance
          CONFORMANCE_REPORT: conformance-results.json
      - name: Show what Hodor logged
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail 300 hodor worker suite-relay
        env:
          HODOR_IMAGE: hodor:conformance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-results
          path: deploy/conformance/conformance-results.json
          retention-days: 14

  # The image of hodor-ext-authz, built as the release builds it: it starts with a configuration that reads,
  # answers its health checks, and stops at once on one that does not. docs/operations/hodor-ext-authz.md.
  ext-authz-image:
    name: Image of hodor-ext-authz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build --file deploy/docker/ext-authz.Dockerfile --tag hodor-ext-authz:ci .
      - name: It starts and answers its health checks
        run: |
          mkdir -p "$RUNNER_TEMP/ext-authz"
          echo '{ "hodor": { "url": "http://hodor:8080", "tenant": "acme" } }' > "$RUNNER_TEMP/ext-authz/config.json"
          chmod -R a+rX "$RUNNER_TEMP/ext-authz"
          docker run --detach --name ext-authz --publish 9090:9090 \
            --volume "$RUNNER_TEMP/ext-authz:/etc/hodor-ext-authz:ro" hodor-ext-authz:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9090/readyz; then exit 0; fi
            sleep 1
          done
          docker logs ext-authz
          exit 1
      - name: It refuses a configuration that does not read
        run: |
          echo '{ "hodor": { "url": "http://hodor:8080" } }' > "$RUNNER_TEMP/ext-authz/broken.json"
          chmod a+r "$RUNNER_TEMP/ext-authz/broken.json"
          if docker run --rm --volume "$RUNNER_TEMP/ext-authz:/etc/hodor-ext-authz:ro" \
            --env HODOR_EXT_AUTHZ_CONFIG=/etc/hodor-ext-authz/broken.json hodor-ext-authz:ci; then
            echo "a configuration without a tenant was accepted"; exit 1
          fi

  # The image of hodor-cert-manager-issuer, built as the release builds it: it prints the public part of a key,
  # and stops at once on a configuration that does not read. It needs a Kubernetes interface to run, which this
  # job has not. docs/operations/hodor-cert-manager-issuer.md.
  cert-manager-issuer-image:
    name: Image of hodor-cert-manager-issuer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build --file deploy/docker/cert-manager-issuer.Dockerfile --tag hodor-cert-manager-issuer:ci .
      - name: It prints the public part of a key
        run: |
          mkdir -p "$RUNNER_TEMP/issuer"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/issuer/key.pem"
          chmod -R a+rX "$RUNNER_TEMP/issuer"
          docker run --rm --volume "$RUNNER_TEMP/issuer:/keys:ro" hodor-cert-manager-issuer:ci \
            jwk --key /keys/key.pem --key-id ci > "$RUNNER_TEMP/jwk.json"
          jq -e '.kty == "EC" and .crv == "P-256" and .kid == "ci" and (has("d") | not)' "$RUNNER_TEMP/jwk.json"
      - name: It refuses a configuration that does not read
        run: |
          echo '{ "hodor": { "url": "http://hodor:8080" } }' > "$RUNNER_TEMP/issuer/broken.json"
          chmod a+r "$RUNNER_TEMP/issuer/broken.json"
          if docker run --rm --volume "$RUNNER_TEMP/issuer:/etc/hodor-cert-manager-issuer:ro" \
            --env HODOR_CERT_MANAGER_ISSUER_CONFIG=/etc/hodor-cert-manager-issuer/broken.json hodor-cert-manager-issuer:ci; then
            echo "a configuration without a tenant was accepted"; exit 1
          fi

  # The two installation packages in deploy/install: the Helm chart renders and the Compose file is valid.
  # Neither is installed here; docs/operations/install-with-docker.md and install-on-kubernetes.md say how
  # that was checked by hand.
  installation:
    name: Installation packages
    runs-on: ubuntu-latest
    env:
      CHART: deploy/install/helm/hodor
      REQUIRED: --set image.repository=registry.example.com/hodor --set publicUrl=https://login.example.com --set secret.name=hodor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The chart and the binaries carry the same version
        run: |
          binaries="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          chart="$(sed -n 's/^version: //p' "$CHART/Chart.yaml")"
          application="$(sed -n 's/^appVersion: "\(.*\)"/\1/p' "$CHART/Chart.yaml")"
          echo "binaries $binaries, chart $chart, application $application"
          test -n "$binaries" && test "$binaries" = "$chart" && test "$binaries" = "$application"
      - name: Lint the chart
        run: helm lint "$CHART" --strict $REQUIRED
      - name: Render the chart with its defaults
        run: helm template hodor "$CHART" --namespace hodor $REQUIRED > /dev/null
      - name: Render the chart with every optional part
        run: >
          helm template hodor "$CHART" --namespace hodor $REQUIRED
          --set ingress.enabled=true --set ingress.className=nginx
          --set server.autoscaling.enabled=true
          --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true
          --set mail.enabled=true --set "mail.from=Hodor <no-reply@example.com>"
          --set "directoryHosts={directory.example.com:636}"
          --set telemetry.metricsEndpoint=http://collector:4318/v1/metrics
          --set telemetry.tracesEndpoint=http://collector:4318/v1/traces
          --set keyProvider.signingKeys=openbao --set keyProvider.openbao.enabled=true
          --set keyProvider.openbao.address=https://openbao.openbao.svc:8200
          --set keyProvider.openbao.certificateAuthority.configMap=openbao-authority
          --set outboundAuthorities.configMap=hodor-authorities
          --set extAuthz.enabled=true --set extAuthz.tenant=acme
          --set extAuthz.token.header=x-hodor-token-claims
          --set "extAuthz.applications[0].destination=spiffe://cluster.local/ns/shop/sa/orders"
          --set "extAuthz.applications[0].clientId=0193f1c2-6a1d-7c55-b0c8-6b1f2c9d4e01"
          --set "extAuthz.applications[0].routes[0].methods={GET}"
          --set "extAuthz.applications[0].routes[0].path=/orders/{id}"
          --set "extAuthz.applications[0].routes[0].resourceType=order"
          --set "extAuthz.applications[0].routes[0].action=read"
          --set certManagerIssuer.enabled=true --set certManagerIssuer.tenant=acme
          --set certManagerIssuer.clientId=0193f3c0-2d4e-7b1a-9c55-6b1f2c9d4e01
          --set certManagerIssuer.approveWithCertManager.enabled=true
          > /dev/null
      - name: Render the chart with cert-manager's issuer alone, signing in with its key
        run: >
          helm lint "$CHART" --strict
          --set certManagerIssuer.enabled=true --set certManagerIssuer.only=true
          --set certManagerIssuer.tenant=acme --set certManagerIssuer.hodorUrl=https://login.example.com
          --set certManagerIssuer.clientId=0193f3c0-2d4e-7b1a-9c55-6b1f2c9d4e01
          --set certManagerIssuer.authentication.method=private_key_jwt
          --set certManagerIssuer.authentication.privateKeyJwt.secretName=hodor-cert-manager-issuer-key
          && helm template hodor-issuer "$CHART" --namespace cert-manager
          --set certManagerIssuer.enabled=true --set certManagerIssuer.only=true
          --set certManagerIssuer.tenant=acme --set certManagerIssuer.hodorUrl=https://login.example.com
          --set certManagerIssuer.clientId=0193f3c0-2d4e-7b1a-9c55-6b1f2c9d4e01
          --set certManagerIssuer.authentication.method=private_key_jwt
          --set certManagerIssuer.authentication.privateKeyJwt.secretName=hodor-cert-manager-issuer-key
          > rendered.yaml
          && ! grep -q 'name: hodor-issuer-hodor-server' rendered.yaml
          && grep -q 'kind: CustomResourceDefinition' rendered.yaml
      - name: Render the chart signing in to OpenBao with an AppRole
        run: >
          helm template hodor "$CHART" --namespace hodor $REQUIRED
          --set keyProvider.openbao.enabled=true --set keyProvider.openbao.authMethod=approle
          --set keyProvider.openbao.address=https://openbao.openbao.svc:8200
          > /dev/null
      - name: The chart refuses to render without its required values
        run: |
          refused() { if "$@" > /dev/null 2>&1; then echo "accepted, and should not be: $*"; return 1; fi; }
          refused helm template hodor "$CHART" --namespace hodor
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set publicUrl=https://login.example.com/path
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set mail.enabled=true
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set keyProvider.signingKeys=openbao
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set keyProvider.openbao.enabled=true
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set extAuthz.enabled=true
          ISSUER="--set certManagerIssuer.enabled=true --set certManagerIssuer.tenant=acme --set certManagerIssuer.clientId=c"
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set certManagerIssuer.enabled=true
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED --set certManagerIssuer.enabled=true --set certManagerIssuer.tenant=acme
          refused helm template hodor "$CHART" --namespace hodor $ISSUER --set certManagerIssuer.only=true
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED $ISSUER --set certManagerIssuer.authentication.method=private_key_jwt
          refused helm template hodor "$CHART" --namespace hodor $REQUIRED $ISSUER --set certManagerIssuer.authentication.method=client_secret_basic
      - name: The Compose file is valid with every part
        env:
          HODOR_IMAGE: hodor:test
          COMPOSE_PROFILES: database,https,tools
          HODOR_PUBLIC_URL: https://login.example.com
          HODOR_OWNER_DATABASE_PASSWORD: placeholder
          HODOR_SERVER_DATABASE_PASSWORD: placeholder
          HODOR_WORKER_DATABASE_PASSWORD: placeholder
          HODOR_SECRET_KEYS: test:placeholder
        run: docker compose -f deploy/install/docker/compose.yaml config --quiet
      - name: The Compose file refuses to start without its secrets
        run: |
          if docker compose -f deploy/install/docker/compose.yaml --env-file deploy/install/docker/.env.example config --quiet 2> /dev/null; then
            echo "the Compose file accepted empty secrets"; exit 1
          fi
