# Publishes the image and the chart of a release, signed. See
# docs/security/supply-chain.md, "What a release publishes".
#
# On the tag of a release (v0.3.0): builds the image for each architecture
# on a machine of that architecture, joins them under one tag, signs the
# image and the chart with cosign and the workflow's own identity, and
# publishes the chart. On a pull request that changes this workflow or the
# Dockerfile: the same builds, and nothing published or signed.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/release.yml
      - deploy/docker/Dockerfile

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hodor
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART: deploy/install/helm/hodor
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  version:
    name: The tag, the chart and the binaries agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: |
          binaries="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          chart="$(sed -n 's/^version: //p' "$CHART/Chart.yaml")"
          application="$(sed -n 's/^appVersion: "\(.*\)"/\1/p' "$CHART/Chart.yaml")"
          echo "binaries $binaries, chart $chart, application $application"
          test -n "$binaries" && test "$binaries" = "$chart" && test "$binaries" = "$application"
          if [ "$PUBLISH" = "true" ]; then
            echo "tag $GITHUB_REF_NAME"
            test "$GITHUB_REF_NAME" = "v$binaries"
          fi
          echo "version=$binaries" >> "$GITHUB_OUTPUT"

  image:
    name: Image for ${{ matrix.architecture }}
    needs: version
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only: the tag is given once both architectures are
      # in, by the job that joins them.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Keep the digest for the job that joins the architectures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.architecture }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish and sign
    if: github.event_name == 'push'
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The certificate cosign signs with is made for this workflow's identity.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Join the architectures under the version's tag
        working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Sign the image
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$IMAGE@$digest"
      - name: Package, publish and sign the chart
        run: |
          helm package "$CHART" --destination chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          pushed="$(helm push "chart/hodor-$VERSION.tgz" "$CHARTS" 2>&1)"
          echo "$pushed"
          digest="$(echo "$pushed" | sed -n 's/^Digest: //p')"
          test -n "$digest"
          cosign sign --yes "${CHARTS#oci://}/hodor@$digest"
      - name: Check both signatures as a person would
        run: |
          identity='^https://github[.]com/${{ github.repository }}/[.]github/workflows/release[.]yml@refs/tags/v'
          for artifact in "$IMAGE:$VERSION" "${CHARTS#oci://}/hodor:$VERSION"; do
            cosign verify "$artifact" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "signature checked: $artifact"
          done
