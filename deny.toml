# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # astral-tokio-tar is unmaintained. It is pulled in only by testcontainers,
    # which is used by the `testing` feature for integration tests and never
    # ships in a release binary. Remove once testcontainers drops it.
    { id = "RUSTSEC-2026-0440", reason = "test-only dependency of testcontainers" },
]

[licenses]
version = 2
# Licenses accepted for third-party dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Asks for nothing, not even attribution. Used by the mail library.
    "0BSD",
    # A permissive license for data: the list of certificate authorities
    # that the TLS verifier of the outbound HTTP client carries for
    # platforms without a trust store of their own.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are unpublished and carry no license field yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
