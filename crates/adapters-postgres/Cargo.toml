[package]
name = "holdor-adapters-postgres"
description = "PostgreSQL adapter: connection pool, tenant-scoped transactions and migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Disposable PostgreSQL in a container, for integration tests.
testing = ["dep:testcontainers", "dep:testcontainers-modules", "dep:tokio"]

[dependencies]
async-trait.workspace = true
holdor-kernel.workspace = true
serde_json.workspace = true
sqlx.workspace = true
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
holdor-adapters-postgres = { path = ".", features = ["testing"] }
holdor-kernel = { workspace = true, features = ["testing"] }
serde.workspace = true
tokio.workspace = true

[lints]
workspace = true
