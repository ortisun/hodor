[package]
name = "hodor-adapters-postgres"
description = "PostgreSQL adapter: connection pool, tenant-scoped transactions and migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Disposable PostgreSQL in a container, for integration tests.
testing = ["dep:testcontainers", "dep:testcontainers-modules", "dep:tokio"]

[dependencies]
async-trait.workspace = true
hodor-audit.workspace = true
hodor-authentication.workspace = true
hodor-authorization.workspace = true
hodor-credential.workspace = true
hodor-identity.workspace = true
hodor-kernel.workspace = true
hodor-notification.workspace = true
hodor-session.workspace = true
hodor-tenant.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# Dev-only: the full sign-in test runs the real hasher against the real
# database. Adapters never depend on each other in production code.
hodor-adapters-crypto.workspace = true
hodor-audit = { workspace = true, features = ["testing"] }
hodor-authentication = { workspace = true, features = ["testing"] }
hodor-authorization = { workspace = true, features = ["testing"] }
hodor-session = { workspace = true, features = ["testing"] }
hodor-notification = { workspace = true, features = ["testing"] }
hodor-credential = { workspace = true, features = ["testing"] }
hodor-identity = { workspace = true, features = ["testing"] }
hodor-tenant = { workspace = true, features = ["testing"] }
async-trait.workspace = true
hodor-adapters-postgres = { path = ".", features = ["testing"] }
hodor-kernel = { workspace = true, features = ["testing"] }
serde.workspace = true
tokio.workspace = true

[lints]
workspace = true
