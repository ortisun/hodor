[package]
name = "hodor-adapters-crypto"
description = "Cryptography adapter: password hashing, signatures, secrets at rest, the local key provider and the operating system's random source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# A provider that signs real tokens, for tests of code that checks them.
testing = ["dep:form_urlencoded", "dep:rcgen", "dep:time"]

[dependencies]
argon2.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
form_urlencoded = { workspace = true, optional = true }
getrandom.workspace = true
hodor-authorization-opa.workspace = true
hodor-credential.workspace = true
hodor-kernel.workspace = true
hodor-keys.workspace = true
hodor-oauth.workspace = true
hodor-webhooks.workspace = true
rcgen = { workspace = true, optional = true }
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, optional = true }
tokio.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
hodor-adapters-crypto = { path = ".", features = ["testing"] }
hodor-credential = { workspace = true, features = ["testing"] }
hodor-federation.workspace = true
form_urlencoded.workspace = true
hodor-kernel = { workspace = true, features = ["testing"] }
hodor-keys = { workspace = true, features = ["testing"] }
http.workspace = true
serde_json.workspace = true
standardwebhooks.workspace = true
time.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# Imported under its library name, `webpki`.
ignored = ["rustls-webpki"]
