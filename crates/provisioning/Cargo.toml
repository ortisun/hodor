[package]
name = "hodor-provisioning"
description = "The provisioning context: the SCIM 2.0 server, mapping SCIM's users and groups to the identity context's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# In-memory ports, the contract suite every implementation must pass, and
# the corpus of filters.
testing = ["hodor-kernel/testing", "hodor-identity/testing"]

[dependencies]
async-trait.workspace = true
hodor-identity.workspace = true
hodor-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
hodor-identity = { workspace = true, features = ["testing"] }
hodor-kernel = { workspace = true, features = ["testing"] }
hodor-provisioning = { path = ".", features = ["testing"] }
proptest.workspace = true
tokio.workspace = true

[lints]
workspace = true
