[package]
name = "hodor-authorization-native"
description = "Conditions of the native engine in Common Expression Language, over the cel crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# An exact version: an upgrade may change what parses. Without `chrono`,
# which is unmaintained (RUSTSEC-2026-0543): the moment is given as text
# (Decision 0025).
cel = { version = "=0.16.0", default-features = false, features = ["regex"] }
hodor-authorization.workspace = true
hodor-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
async-trait.workspace = true
hodor-authorization = { workspace = true, features = ["testing"] }
hodor-kernel = { workspace = true, features = ["testing"] }
tokio.workspace = true

[lints]
workspace = true
