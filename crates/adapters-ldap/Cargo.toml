[package]
name = "hodor-adapters-ldap"
description = "Directory adapter: asks LDAP directories whether a person and a password belong together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# A directory in a container, with people in it, for tests.
testing = ["dep:testcontainers", "dep:tokio"]

[dependencies]
async-trait.workspace = true
hodor-federation.workspace = true
hodor-kernel.workspace = true
ldap3 = { workspace = true }
testcontainers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
hodor-adapters-ldap = { path = ".", features = ["testing"] }
tokio.workspace = true

[lints]
workspace = true
