rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
hodor-kernel.workspace = true
hodor-keys.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
hodor-adapters-crypto.workspace = true
hodor-adapters-http.workspace = true
hodor-kernel = { workspace = true, features = ["testing"] }
