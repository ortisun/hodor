[package]
name = "hodor-audit"
description = "The audit context: one record per event, chained per tenant so that changing or removing a record can be noticed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# In-memory log and the contract suite that every implementation must pass.
testing = ["hodor-kernel/testing"]

[dependencies]
async-trait.workspace = true
hodor-kernel.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
hodor-audit = { path = ".", features = ["testing"] }
hodor-kernel = { workspace = true, features = ["testing"] }
proptest.workspace = true
serde.workspace = true
tokio.workspace = true

[lints]
workspace = true
