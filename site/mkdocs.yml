# The documentation site of Hodor, built from docs/ with MkDocs and the Material theme.
# How it is built and published: docs/development/documentation-site.md.
#
#   python3 -m venv site/.venv
#   site/.venv/bin/pip install --require-hashes -r site/requirements.txt
#   site/.venv/bin/mkdocs serve -f site/mkdocs.yml
#   site/.venv/bin/mkdocs build -f site/mkdocs.yml --strict

site_name: Hodor
site_description: Identity, authentication and authorization for many tenants, written in Rust.
site_url: https://ortisun.github.io/hodor/
repo_url: https://github.com/ortisun/hodor
repo_name: ortisun/hodor
edit_uri: edit/develop/docs/
copyright: Hodor documentation, written in <code>docs/</code> of the repository.

# The pages are the ones in docs/, read where they are.
docs_dir: ../docs
site_dir: build
# Contracts for coding agents, not pages for readers.
exclude_docs: |
  EGM.md

hooks:
  - hooks.py

# `mkdocs serve` also rebuilds when these change.
watch:
  - pages
  - hooks.py
  - overrides
  - ../crates/protocol-http/openapi

theme:
  name: material
  custom_dir: overrides
  language: en
  # The logo is in docs/, with the other pictures: docs/images/logo/.
  logo: images/logo/hodor-icon.png
  favicon: images/logo/hodor-icon.png
  icon:
    repo: fontawesome/brands/github
  # The system's own fonts: nothing is fetched from a font service.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use the light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow the system
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/stylesheets/hodor.css

# Mermaid at one exact version. Without it the theme loads the newest 11.x it finds.
extra_javascript:
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js

plugins:
  - search
  - swagger-ui-tag:
      # The page shows the document; requests are made with curl against the development stack.
      supportedSubmitMethods: []
      docExpansion: list
      syntaxHighlightTheme: monokai

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Anchors as GitHub makes them, so that a link written for GitHub works on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  # The icons of the home page, drawn from the theme's own sets.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

