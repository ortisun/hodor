[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tests/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/ortisun/hodor"
license = "MIT"

[workspace.dependencies]
hodor-adapters-crypto = { path = "crates/adapters-crypto" }
hodor-adapters-postgres = { path = "crates/adapters-postgres" }
hodor-adapters-http = { path = "crates/adapters-http" }
hodor-adapters-kms = { path = "crates/adapters-kms" }
hodor-adapters-ldap = { path = "crates/adapters-ldap" }
hodor-adapters-policy-check = { path = "crates/adapters-policy-check" }
hodor-adapters-smtp = { path = "crates/adapters-smtp" }
hodor-audit = { path = "crates/audit" }
hodor-authentication = { path = "crates/authentication" }
hodor-authorization = { path = "crates/authorization" }
hodor-authorization-native = { path = "crates/authorization-native" }
hodor-authorization-opa = { path = "crates/authorization-opa" }
hodor-credential = { path = "crates/credential" }
hodor-ext-authz = { path = "apps/hodor-ext-authz" }
hodor-cert-manager-issuer = { path = "apps/hodor-cert-manager-issuer" }
hodor-federation = { path = "crates/federation" }
hodor-identity = { path = "crates/identity" }
hodor-kernel = { path = "crates/kernel" }
hodor-keys = { path = "crates/keys" }
hodor-notification = { path = "crates/notification" }
hodor-oauth = { path = "crates/oauth" }
hodor-observability = { path = "crates/observability" }
hodor-protocol-http = { path = "crates/protocol-http" }
hodor-provisioning = { path = "crates/provisioning" }
hodor-saml = { path = "crates/saml" }
hodor-session = { path = "crates/session" }
hodor-tenant = { path = "crates/tenant" }
# Only for tests: how they start containers and reach them.
hodor-test-containers = { path = "tests/containers" }
hodor-webhooks = { path = "crates/webhooks" }

argon2 = "0.6"
aws-lc-rs = "1"
async-trait = "0.1"
axum = "0.8"
cargo_metadata = "0.23"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# Envoy's types, generated from its `.proto` files and shipped compiled, so
# that no build needs `protoc` or the network (Decision 0058). Only
# hodor-ext-authz, and the server's tests that call it.
envoy-types = "0.7"
proptest = "1"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
] }
opentelemetry_sdk = "0.33"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13", default-features = false }
# X.509 paths of forwarded certificates (Decision 0056), and of the
# certificates of a tenant's authority, whose URI name constraints Hodor
# reads itself (Decision 0062); only hodor-adapters-crypto.
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
form_urlencoded = "1"
futures = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
# Only to check, in tests, the tokens Hodor signs with a library of its own.
jsonwebtoken = { version = "12", default-features = false }
# The Kubernetes client for Rust and its controller runtime (Decision 0074);
# only hodor-cert-manager-issuer. The oldest version of Kubernetes it reads
# is the earliest k8s-openapi supports.
k8s-openapi = { version = "0.29", default-features = false, features = ["std", "earliest"] }
kube = { version = "5", default-features = false, features = [
    "client",
    "runtime",
    "rustls-tls",
    "aws-lc-rs",
] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
miniz_oxide = "0.9"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls",
    "aws-lc-rs",
    "rustls-native-certs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Only to check, in tests, the webhooks Hodor signs with a library of its own.
standardwebhooks = "1.3"
http = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs-native-roots",
    "macros",
    "migrate",
    "json",
    "uuid",
    "time",
] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
thiserror = "2"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# gRPC for Envoy's external authorization; only hodor-ext-authz.
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "limit", "timeout"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# Only hodor-saml may depend on an XML library (Decision 0019). Signing,
# encryption, XSLT and legacy algorithms are not compiled.
xml-sec = { version = "0.6", default-features = false, features = [
    "std",
    "xmldsig",
    "xml-backend-differential",
] }
x509-parser = "0.18"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
