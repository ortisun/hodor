[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tests/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/ortisun/holdor"

[workspace.dependencies]
holdor-adapters-postgres = { path = "crates/adapters-postgres" }
holdor-kernel = { path = "crates/kernel" }
holdor-observability = { path = "crates/observability" }

async-trait = "0.1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive", "env"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
] }
opentelemetry_sdk = "0.33"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs-native-roots",
    "macros",
    "migrate",
    "json",
    "uuid",
    "time",
] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
thiserror = "2"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
